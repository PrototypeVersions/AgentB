name: AgentB research cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AgentB
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          MOLTBOOK_WRITE_ENABLED: ${{ vars.MOLTBOOK_WRITE_ENABLED || 'false' }}
        run: python agentb.py cycle

      - name: Persist research memory
        run: |
          if git diff --quiet -- data/; then
            echo "No memory changes to commit."
            exit 0
          fi
          git config user.name "AgentB"
          git config user.email "agentb@users.noreply.github.com"
          git add data/memory.jsonl
          git commit -m "AgentB: persist research cycle"
          git push
